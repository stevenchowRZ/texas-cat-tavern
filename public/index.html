<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#130b08">
  <meta name="screen-orientation" content="landscape">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="德州猫猫酒馆">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/app-icon-192.png">
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/layout.css"><link rel="stylesheet" href="/seats.css"><link rel="stylesheet" href="/landscape.css"><link rel="stylesheet" href="/seat-counts.css"><link rel="stylesheet" href="/six-seats.css"><link rel="stylesheet" href="/uniform-seats.css"><link rel="stylesheet" href="/table-final.css"><link rel="stylesheet" href="/effects.css"><link rel="stylesheet" href="/scene-v2.css"><link rel="stylesheet" href="/ux-v3.css"><link rel="stylesheet" href="/layout-v4.css"><link rel="stylesheet" href="/deal-v5.css"><link rel="stylesheet" href="/pixel-theme.css"><link rel="stylesheet" href="/side-layout-v6.css"><link rel="stylesheet" href="/tavern.css"><link rel="stylesheet" href="/viewport-lock.css"><link rel="stylesheet" href="/tavern-trial-scale.css">
  <title>德州猫猫酒馆</title>
</head>
<body><main id="app">
  <section id="home" class="screen">
    <div class="brand"><span class="mark">♠</span><button id="enterTavern" class="brand-tavern">← 返回路易的酒馆 <small>完成白天牌桌赛后进入夜晚</small></button><p id="pokerDayHint">白天 · 赢光全桌筹码或输光筹码，也可以跳过</p></div>
    <div class="panel">
      <div class="profile-row">
        <label class="name-field">玩家姓名<input id="name" maxlength="12" value="路易" readonly></label>
        <fieldset class="avatar-field louis-avatar-locked"><legend>选择猫猫头像</legend><div id="avatarPicker" class="avatar-picker" aria-label="选择猫猫头像">
          <button type="button" data-avatar="1" aria-label="猫咪头像 1"><img src="/assets/cat-avatars/1.png" alt=""></button><button type="button" data-avatar="2" aria-label="猫咪头像 2"><img src="/assets/cat-avatars/2.png" alt=""></button><button type="button" data-avatar="3" aria-label="猫咪头像 3"><img src="/assets/cat-avatars/3.png" alt=""></button><button type="button" data-avatar="4" aria-label="猫咪头像 4"><img src="/assets/cat-avatars/4.png" alt=""></button><button type="button" data-avatar="5" aria-label="猫咪头像 5"><img src="/assets/cat-avatars/5.png" alt=""></button><button type="button" data-avatar="6" aria-label="猫咪头像 6"><img src="/assets/cat-avatars/6.png" alt=""></button>
        </div></fieldset>
      </div>
      <div class="settings">
        <label>牌桌人数<select id="targetSeats"><option value="2">2 人</option><option value="3">3 人</option><option value="4" selected>4 人</option><option value="5">5 人</option><option value="6">6 人</option><option value="7">7 人</option><option value="8">8 人</option><option value="9">9 人</option><option value="10">10 人</option></select></label>
        <label>初始筹码<select id="initialChips"><option value="1000">1,000</option><option value="5000" selected>5,000</option><option value="10000">10,000</option><option value="50000">50,000</option></select></label>
        <label>初始盲注<select id="blinds"><option value="5/10">5 / 10</option><option value="10/20" selected>10 / 20</option><option value="25/50">25 / 50</option><option value="50/100">50 / 100</option></select></label>
        <label>盲注升级<select id="blindInterval"><option value="0">不变化</option><option value="5">每 5 分钟</option><option value="10" selected>每 10 分钟</option><option value="15">每 15 分钟</option><option value="30">每 30 分钟</option></select></label>
      </div>
      <p class="setting-note">真人自己选头像，AI 会随机选择；空位开局后由 AI 补齐</p>
      <div class="lobby-actions"><button class="primary" data-mode="solo">单人练习 <small>与猫咪 AI 对局</small></button><button class="secondary" data-mode="host">创建好友房 <small>同一 Wi‑Fi / 手机热点</small></button><div class="join"><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="6 位房间码"><button id="joinBtn">加入房间</button></div></div>
    </div>
    <p class="hint">仅供娱乐练习，不含现金与充值功能</p>
  </section>
  <section id="tavern" class="screen active">
    <header class="tavern-head"><button id="tavernBack">白天</button><div><b>德州猫猫酒馆</b><span id="nightStatus">第 1 天 · 白天</span></div><div class="coin-badge"><button id="tavernMusic" class="music-toggle" type="button" aria-label="切换酒馆背景音乐" aria-pressed="true" title="Chasing What's Gone — Loom Room">♫</button><i class="cat-coin-icon" aria-label="猫猫币"></i><b id="tavernCoins">0</b>　Lv.<b id="tavernLevel">1</b></div></header>
    <div class="tavern-scene">
      <div id="phaseBanner" class="phase-banner" aria-live="polite"></div>
      <div class="tavern-title"><strong>鸡尾酒吧营业</strong><small>22:00 — 2:00</small></div>
      <button id="pokerNeon" class="poker-neon" type="button" aria-label="进入德州扑克"><b>《德州扑克》</b><small>RANDOM TABLE →</small></button>
      <button id="friendNeon" class="friend-neon" type="button" aria-label="进入联机对战"><b>《联机对战》</b><small>ONLINE TABLE</small></button>
      <div id="dayTimeline" class="day-timeline" aria-label="路易一天的时间线"></div>
      <div class="backbar" aria-hidden="true"><div class="bottle-row">▥ ▥ ▥ ▥ ▥ ▥ ▥</div><div class="bottle-row">▥ ▥ ▥ ▥ ▥ ▥ ▥</div></div>
      <div class="lamp lamp-left" aria-hidden="true"></div><div class="lamp lamp-right" aria-hidden="true"></div>
      <div class="bartender-wrap"><div id="bartenderCat"></div><i id="barAction"></i></div>
      <div id="guestLine" class="guest-line" aria-label="等待点单的猫咪客人"></div>
      <button id="serveTray" class="server-cat" disabled><div id="serverCat"></div><i id="carryDrink" aria-hidden="true"></i><span>← → 移动　空格取酒 / 送酒</span></button>
      <div id="mixingGlass" class="mixing-glass" aria-label="酒保出杯位置"></div>
      <div class="bar-counter"><span id="readyDrink">酒保工作台</span></div>
      <div class="bar-stools" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="tavern-panel"><div id="tavernContent"></div></div>
  </section>
  <section id="table" class="screen">
    <header><button id="leave">‹</button><div class="room-info"><b>德州猫猫酒馆</b><span id="roomLabel"></span></div><button id="copy">邀请</button></header>
    <div class="casino"><div class="table-logo">CAT’S<br><b>HOLD’EM</b></div><div class="felt"><div id="pot" class="pot">底池 0</div><div id="board" class="cards board"></div><div id="players"></div><div id="result"></div></div></div>
    <div id="waiting" class="waiting"><h2>等待玩家加入</h2><p id="seatStatus">把房间码发给同一网络中的好友</p><strong id="bigCode"></strong><button id="start" class="primary">开始牌局</button></div>
    <div id="controls" class="controls"><div id="turnText"></div><div id="raiseBox"><div class="raise-head"><span>加注到</span><b id="raiseValue"></b></div><input id="raise" type="range"><div class="quick-bets"><button data-bet="min">最小</button><button data-bet="half">½ 底池</button><button data-bet="pot">底池</button><button data-bet="all">全下</button></div><div class="stepper"><button id="minus">−</button><button id="confirmRaise">确认加注</button><button id="plus">＋</button></div></div><div class="actions"><button id="fold">弃牌</button><button id="checkCall">过牌</button><button id="raiseBtn">加注</button></div></div>
  </section>
  <div id="rotateHint"><span>↻</span><b>请横屏进入猫猫酒馆</b><small>旋转手机后即可设置房间和开始游戏</small></div><div id="recipeCelebration" class="recipe-celebration" hidden></div><div id="toast"></div>
</main><script src="/app.js"></script><script src="/tavern-game.js"></script></body></html>
